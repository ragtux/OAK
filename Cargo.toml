[workspace]
resolver = "2"
members = [
    "crates/oak",
    "crates/oak-text",
    "crates/oak-syntax",
    "crates/oak-theme",
    "crates/oak-keymap",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
oak-text = { path = "crates/oak-text" }
oak-syntax = { path = "crates/oak-syntax" }
oak-theme = { path = "crates/oak-theme" }
oak-keymap = { path = "crates/oak-keymap" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
# Rope text storage (MIT). Zed's own `rope` crate is GPL-3.0, so it stays out of the tree.
ropey = "1.6"
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-md = "0.5"
tempfile = "3"

# Cargo.lock pins libc to 0.2.189: gpui -> http_client -> async-tar -> xattr 0.2.3 reads `libc::ENOATTR`,
# which libc 0.2.190 removed on Linux. Drop the pin once async-tar moves to xattr 1.x.
# gpui is pinned to the same Zed release commit as scoria (v1.3.6, 2026-05-21): the crates.io
# release bundles a blade whose ray-tracing request fails vkCreateDevice on NVIDIA. Bump the two
# together, one Zed release at a time, and run the app on a real GPU before committing.
gpui = { git = "https://github.com/zed-industries/zed", rev = "4ce18741ad2ea007cb20a1dd96d2a170d224cc01" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "4ce18741ad2ea007cb20a1dd96d2a170d224cc01", features = ["font-kit", "wayland", "x11"] }

[profile.dev]
opt-level = 0

# gpui and its graphics stack are unusable at opt-level 0; keep dependencies optimized in debug builds.
[profile.dev.package."*"]
opt-level = 2
